name: Scrape sbox.game/learn

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache camoufox browser
        id: cache-camoufox
        uses: actions/cache@v4
        with:
          path: backend/camoufox_build
          key: camoufox-jwriter20-v152.0.4-beta.28-v1

      - name: Download camoufox browser
        if: steps.cache-camoufox.outputs.cache-hit != 'true'
        run: |
          cd backend
          curl -fL -o camoufox.zip "https://github.com/JWriter20/camoufox/releases/download/v152.0.4-20260729/camoufox-152.0.4-beta.28-lin.x86_64.zip"
          unzip -q camoufox.zip -d camoufox_build
          rm camoufox.zip
          chmod +x camoufox_build/camoufox-bin
          # This release ships NO version.json; setup_camoufox.py synthesises it
          # from application.ini. Assert on what the archive actually contains.
          test -x camoufox_build/camoufox-bin || { echo "no camoufox-bin in archive"; exit 1; }
          test -f camoufox_build/application.ini || { echo "no application.ini in archive"; exit 1; }
          grep '^Version=' camoufox_build/application.ini

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libx11-xcb1 libasound2t64 libdbus-glib-1-2 libxt6

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      # Node + @stackone/defender drive the prompt-injection scanner that
      # filters tutorial bodies before they land in docs/. Without this
      # step the scrape still works but no scanning happens (the bridge
      # logs a warning and the manifest's defender.active is false),
      # which we treat as a CI failure further down by checking the
      # manifest after the scrape.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install defender (Node)
        working-directory: backend
        run: npm install --omit=dev --no-audit --no-fund

      # camoufox >=0.5 replaced the flat cache layout with a multiversion one, so
      # the old `ln -s camoufox_build $CACHE_DIR` no longer resolves:
      # installed_verstr() raises CamoufoxNotInstalled and every scrape silently
      # returns nothing.
      - name: Register camoufox build with the camoufox library
        run: python backend/setup_camoufox.py

      - name: Run scraper
        working-directory: backend/src
        # pipefail is load-bearing: scrape.py already ends in
        #   sys.exit(0 if written > 0 else 1)
        # but a pipeline reports the LAST command's status, so `| tail` returned 0
        # and the job went green while the scrape wrote nothing. That masked a
        # CamoufoxNotInstalled crash for 35 days (last real mirror update
        # 2026-06-28); every daily run "succeeded" in ~1m17s.
        run: |
          set -o pipefail
          python scrape.py 2>&1 | tail -200
        timeout-minutes: 15

      # Hard guard: fail the build if the manifest shows the defender
      # bridge was NOT active. Catches a regression where Node setup or
      # `npm install` quietly failed and the scrape proceeded unscanned.
      - name: Verify defender ran
        run: |
          python3 - <<'PY'
          import json, sys
          mf = json.load(open("docs/_manifest.json"))
          # docs/_manifest.json is COMMITTED, so a run that crashed before writing
          # one would validate the PREVIOUS run's manifest and pass. Require it to
          # be from this run before trusting anything in it.
          from datetime import datetime, timezone
          ts = mf.get("scraped_at", "")
          try:
              age = (datetime.now(timezone.utc)
                     - datetime.fromisoformat(ts.replace("Z", "+00:00"))).total_seconds()
          except Exception:
              print(f"::error::manifest has no parseable scraped_at ({ts!r}) - cannot tell "
                    "whether this is from the current run")
              sys.exit(1)
          if age > 3600:
              print(f"::error::manifest is stale ({age/3600:.1f}h old, scraped_at={ts}) - the "
                    "scrape did not write one this run, so this guard would be checking a "
                    "previous run's result")
              sys.exit(1)
          d = mf.get("defender", {})
          if not d.get("active"):
              print("::error::defender did not run for this scrape — manifest defender.active is false")
              print("Check the 'Run scraper' step above for the bridge-startup warning.")
              sys.exit(1)
          print(f"defender ok: scanned={d['scanned']} passed={d['passed']} blocked={len(d.get('blocked', []))}")
          PY

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git diff --staged --quiet || git commit -m "Update sbox.game/learn mirror $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
